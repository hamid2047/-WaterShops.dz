<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إتمام الطلب</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
🛍️ Premium Store
</div>

<a href="index.html" style="color:white">
العودة
</a>

</header>



<section>

<h2>
إتمام الطلب
</h2>


<div class="checkout-box">


<input id="name"
placeholder="الاسم الكامل">


<input id="phone"
placeholder="رقم الهاتف">


<input id="address"
placeholder="العنوان">


<button onclick="orderNow()">

إرسال الطلب عبر واتساب

</button>


</div>


</section>



<script>


function orderNow(){


let name =
document.getElementById("name").value;


let phone =
document.getElementById("phone").value;


let address =
document.getElementById("address").value;



let cart =
JSON.parse(localStorage.getItem("cart")) || [];



let message =
"🛒 طلب جديد من Premium Store\n\n";


message +=
"👤 الاسم: "+name+"\n";


message +=
"📞 الهاتف: "+phone+"\n";


message +=
"📍 العنوان: "+address+"\n\n";


message +=
"📦 المنتجات:\n";



let total=0;


cart.forEach(item=>{


message +=
"- "+item.name+
" × "+item.quantity+"\n";


total += item.price * item.quantity;


});



message +=
"\n💰 المجموع: "+total+" دج";



window.open(

"https://wa.me/213778196483?text="
+encodeURIComponent(message)

);


}


</script>


</body>
</html>
