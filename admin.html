<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة التحكم | Water Shop 💧</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>🛍️ لوحة التحكم</h1>

<a href="index.html">⬅ العودة للمتجر</a>

</header>

<section class="admin">

<h2>إضافة منتج جديد</h2>

<input
type="text"
id="name"
placeholder="اسم المنتج">

<input
type="text"
id="category"
placeholder="القسم">

<input
type="number"
id="price"
placeholder="السعر">

<input
type="file"
id="image"
accept="image/*">

<input
type="text"
id="description"
placeholder="وصف المنتج">

<input
type="number"
id="rating"
min="1"
max="5"
placeholder="التقييم">

<button onclick="saveProduct()">

💾 حفظ المنتج

</button>

</section>

<hr>

<section>

<h2>📦 المنتجات الموجودة</h2>

<div id="products-list"></div>

</section>

<script type="module" src="admin.js"></script>

</body>

</html>
