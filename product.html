<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تفاصيل المنتج | Water Shop</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
🛍️ Water Shop 💧

<span>
متجر إلكتروني
</span>

</div>


<a href="index.html" style="color:white;text-decoration:none">
⬅ العودة للمتجر
</a>


</header>




<section id="product-details">


<div id="details-box">

</div>


</section>




<section>

<h2>
منتجات مشابهة
</h2>


<div class="products-container" id="similar-products">

</div>


</section>





<script>


let products =
JSON.parse(localStorage.getItem("products")) || [];



let cart =
JSON.parse(localStorage.getItem("cart")) || [];



let id =
new URLSearchParams(window.location.search)
.get("id");



let product =
products.find(p=>p.id == id);



let box =
document.getElementById("details-box");



if(product){


box.innerHTML = `


<div class="product">


<img src="${product.image}">


<h1>
${product.name}
</h1>


<h2 class="price">
${product.price} دج
</h2>


<div class="rating">

${"⭐".repeat(product.rating)}

</div>



<p>
${product.description}
</p>



<button onclick="addToCart()">

🛒 أضف للسلة

</button>


<button class="order"
onclick="buyNow()">

💬 اطلب الآن

</button>


</div>


`;



}



function addToCart(){



let exist =
cart.find(p=>p.id==product.id);



if(exist){

exist.quantity++;

}

else{

cart.push({

...product,

quantity:1

});

}



localStorage.setItem(
"cart",
JSON.stringify(cart)
);



alert("✅ تمت إضافة المنتج للسلة");


}





function buyNow(){


let message =

"💧 Water Shop\n\n"+
"أريد طلب:\n"+
product.name+
"\nالسعر: "+
product.price+
" دج";


window.open(

"https://wa.me/213778196483?text="+
encodeURIComponent(message)

);


}





// منتجات مشابهة


let similar =
products.filter(p=>

p.category == product.category
&&
p.id != product.id

);



let similarBox =
document.getElementById("similar-products");



similar.forEach(p=>{


similarBox.innerHTML += `


<div class="product">


<img src="${p.image}">


<h3>
${p.name}
</h3>


<p class="price">
${p.price} دج
</p>


<button onclick="location.href='product.html?id=${p.id}'">

عرض

</button>


</div>


`;


});



</script>



</body>

</html>
